apiVersion: v1
kind: Secret
metadata:
  name: hedgedoc
  labels:
    app: hedgedoc
type: Opaque
stringData:
  CMD_DB_URL: "postgres://hedgedoc:password@hostname:5432/hedgedoc"
  CMD_SESSION_SECRET: "REPLACE_WITH_SOME_RANDOM_STRING"
  # for image uploads
  CMD_S3_ACCESS_KEY_ID: "REPLACE_S3_ACCESS_KEY_ID"
  CMD_S3_SECRET_ACCESS_KEY: "REPLACE_S3_SECRET_ACCESS_KEY"



kubectl run alpine-one-shot --rm -i --tty --image=alpine -- /bin/sh
