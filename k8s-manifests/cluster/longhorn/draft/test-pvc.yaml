# Throwaway PVC + pod to validate the Longhorn install end to end. Appends a
# line on every start, so recreating the pod proves the data survived. Delete
# both when done -- nothing here is meant to stay in the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-test
  namespace: default
spec:
  # local-path is the cluster default, so longhorn has to be asked for by name
  storageClassName: longhorn
  # RWO only -- nfs-common is not installed on the nodes, so RWX cannot mount
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-test
  namespace: default
spec:
  containers:
    - name: writer
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          echo "started $(date +%Y-%m-%dT%H:%M:%S) on ${NODE_NAME}" >> /data/log
          cat /data/log
          sleep 3600
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-test
