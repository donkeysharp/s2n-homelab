---
wireguard_mode: server
wireguard_address: 10.10.10.1/24

wireguard_peers:
  - name: galadriel
    host: galadriel
    allowed_ips:
      - 10.10.10.2/32
      - 192.168.175.0/24
  - name: frodo
    host: frodo
    allowed_ips:
      - 10.10.10.3/32
  - name: samwise
    host: samwise
    allowed_ips:
      - 10.10.10.4/32
  - name: elrond
    host: elrond
    allowed_ips:
      - 10.10.10.5/32
  - name: arwen
    host: arwen
    allowed_ips:
      - 10.10.10.6/32

# k3s nodes reached over the tunnel. galadriel is the control plane, so it only
# takes traffic when every agent is down
l4_proxy_servers:
  - name: frodo
    address: 10.10.10.3
  - name: samwise
    address: 10.10.10.4
  - name: elrond
    address: 10.10.10.5
  - name: arwen
    address: 10.10.10.6
  - name: galadriel
    address: 10.10.10.2
    backup: true
